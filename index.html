<title>인카 수수료예시표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --ink:#13243a; --ink-soft:#3f5670; --line:#dde5ee; --line-strong:#c4d1e0;
  --paper:#f4f7fb; --card:#ffffff; --primary:#0f6b57; --primary-d:#0b513f;
  --navy:#0f2f4a; --navy-d:#0a2233; --gold:#b8842b; --gold-bg:#fff7e8;
  --muted:#7488a0; --shadow:0 2px 14px rgba(15,47,74,.08);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:18px; line-height:1.5; letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;
  word-break:keep-all; overflow-wrap:break-word;
}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

/* Header */
header{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-d) 100%);
  color:#fff;padding:18px 20px 16px;position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{font-weight:800;font-size:15px;letter-spacing:.14em;background:#fff;color:var(--navy);
  padding:4px 9px;border-radius:7px;}
.brand .ttl{font-size:17px;font-weight:700;opacity:.97;}
.brand .ver{margin-left:auto;font-size:12px;opacity:.6;}

/* Progress */
.prog{display:flex;gap:6px;margin-top:14px;}
.prog .seg{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.22);transition:.3s;}
.prog .seg.on{background:#5fd0b4;}
.prog .seg.done{background:#2f9e84;}

main{flex:1;padding:18px 16px 28px;}

/* Summary chips */
.summary{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;min-height:4px;}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;
  font-size:14px;color:var(--ink-soft);font-weight:600;box-shadow:var(--shadow);}
.chip b{color:var(--navy);font-weight:800;}

/* Step card */
.step-h{font-size:14px;font-weight:700;color:var(--primary);letter-spacing:.02em;margin:2px 0 4px;}
.step-q{font-size:23px;font-weight:800;color:var(--ink);margin:0 0 18px;letter-spacing:-.02em;}

/* Option list (large tap targets) */
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:18px 18px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow);transition:transform .06s,border-color .15s;min-height:62px;
}
.opt:active{transform:scale(.985);}
.opt.sel{border-color:var(--primary);background:#f0faf6;}
.opt .ic{font-size:15px;color:var(--muted);margin-left:auto;font-weight:600;flex-shrink:0;white-space:nowrap;padding-left:12px;}
.opt.sel .ic{color:var(--primary);}
.opt .sub{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px;}

/* Premium input */
.amt-box{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px;}
.amt-input{display:flex;align-items:baseline;justify-content:center;gap:8px;}
.amt-input input{
  border:none;outline:none;font-family:inherit;font-size:40px;font-weight:800;color:var(--navy);
  text-align:right;width:100%;max-width:260px;background:transparent;letter-spacing:-.02em;
}
.amt-input .won{font-size:24px;font-weight:800;color:var(--ink-soft);}
.amt-read{text-align:center;color:var(--muted);font-size:15px;font-weight:600;margin-top:6px;min-height:20px;}
.quick{display:flex;gap:8px;margin-top:16px;}
.quick button{flex:1;background:#eef3f9;border:1.5px solid var(--line);border-radius:12px;
  padding:13px 0;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.quick button:active{background:#e2ebf5;}

/* Nav buttons */
.nav{display:flex;gap:11px;margin-top:22px;}
.btn{flex:1;border:none;border-radius:15px;padding:18px 0;font-family:inherit;font-size:19px;
  font-weight:800;cursor:pointer;min-height:60px;transition:transform .06s,opacity .15s;letter-spacing:-.01em;}
.btn:active{transform:scale(.98);}
.btn-prev{background:#fff;border:2px solid var(--line-strong);color:var(--ink-soft);flex:0 0 34%;}
.btn-next{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(15,107,87,.32);}
.btn-next:disabled{background:#b9c6d4;box-shadow:none;cursor:not-allowed;}
.btn-go{background:linear-gradient(135deg,var(--navy),#16466b);color:#fff;
  box-shadow:0 4px 16px rgba(15,47,74,.3);}

/* Result */
.result{animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.res-cond{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:18px 20px;}
.res-cond .l1{font-size:14px;opacity:.7;font-weight:600;margin-bottom:3px;}
.res-cond .l2{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.35;}
.res-cond .l3{font-size:14px;opacity:.85;font-weight:600;margin-top:7px;}
.res-body{background:var(--card);box-shadow:var(--shadow);border-radius:0 0 var(--r) var(--r);
  overflow:hidden;border:1px solid var(--line);border-top:none;}
.row{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);}
.row .lab{font-size:18px;font-weight:700;color:var(--ink-soft);}
.row .val{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.row.sum{background:var(--gold-bg);border-bottom:none;padding:22px 20px;}
.row.sum .lab{color:var(--gold);font-size:19px;font-weight:800;}
.row.sum .val{color:var(--gold);font-size:30px;font-weight:900;}
.disc{font-size:12.5px;color:var(--muted);line-height:1.55;margin:16px 4px 4px;font-weight:500;}

footer{padding:16px;text-align:center;font-size:12px;color:var(--muted);}

/* tab bar (future comparison) */
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);position:sticky;bottom:0;}
.tabs button{flex:1;background:none;border:none;padding:11px 0 13px;font-family:inherit;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabs button .ti{font-size:21px;}
.tabs button.act{color:var(--primary);}
.tabs button:disabled{opacity:.55;}
.hidden{display:none!important;}

/* 로그인 - 인카 공식 브랜드(#142D85) */
#login{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(158deg,#0e2167 0%,#142D85 52%,#23409c 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;}
#login::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);top:-110px;right:-90px;}
#login::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,160,255,.18),transparent 70%);bottom:-80px;left:-90px;}
.login-inner{position:relative;width:100%;max-width:392px;}
.login-brand{text-align:center;margin-bottom:26px;}
.login-brand img{width:248px;max-width:74%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,10,50,.25));}
.login-ma{font-size:18px;font-weight:700;color:#fff;margin-top:12px;letter-spacing:.05em;opacity:.97;}
.login-tag{font-size:17px;font-weight:600;margin-top:7px;color:#fff;opacity:.85;letter-spacing:.02em;}
.login-card{background:#fff;border-radius:22px;padding:30px 26px 26px;box-shadow:0 24px 60px rgba(6,20,80,.45);}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.login-field input{width:100%;border:2px solid var(--line);border-radius:13px;padding:16px;
  font-family:inherit;font-size:18px;font-weight:600;outline:none;transition:border-color .15s;}
.login-field input:focus{border-color:#142D85;}
.login-err{color:#c0392b;font-size:14px;font-weight:600;min-height:20px;margin:2px 0;}
.login-btn{width:100%;border:none;border-radius:14px;background:linear-gradient(135deg,#142D85,#23409c);
  color:#fff;padding:18px;font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;
  box-shadow:0 5px 16px rgba(20,45,133,.42);transition:transform .06s;}
.login-btn:active{transform:scale(.98);}
.login-hint{text-align:center;color:var(--muted);font-size:13px;font-weight:500;margin-top:18px;}
.logout-btn{margin-left:auto;background:rgba(255,255,255,.16);border:none;color:#fff;
  font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;}
.basis{margin-top:11px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);
  color:#d4e6f5;font-size:13.5px;font-weight:700;padding:6px 13px;border-radius:99px;letter-spacing:.01em;}
.seg-toggle{display:flex;background:#e9eff5;border-radius:14px;padding:5px;margin-bottom:16px;}
.seg-toggle button{flex:1;border:none;background:none;padding:14px 0;font-family:inherit;
  font-size:16px;font-weight:700;color:var(--ink-soft);border-radius:10px;cursor:pointer;transition:.15s;}
.seg-toggle button.act{background:#fff;color:var(--primary);box-shadow:var(--shadow);}

/* 비교표 */
.cmp-intro{font-size:15px;color:var(--ink-soft);font-weight:600;margin:2px 0 14px;line-height:1.5;}
.item-card{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:11px;}
.item-card .meta{font-size:13px;color:var(--primary);font-weight:700;margin-bottom:3px;}
.item-card .nm{font-size:17px;font-weight:700;color:var(--ink);line-height:1.4;}
.item-card .tm{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px;}
.item-card .del{margin-left:auto;flex-shrink:0;background:#f3f5f8;border:none;border-radius:9px;
  width:40px;height:40px;font-size:17px;color:var(--muted);cursor:pointer;}
.add-btn{width:100%;border:2px dashed var(--line-strong);background:#fbfdff;border-radius:14px;
  padding:18px 0;font-family:inherit;font-size:18px;font-weight:700;color:var(--primary);cursor:pointer;margin-bottom:4px;}
.add-btn:active{background:#f0f6fb;}
.sortbar{display:flex;background:#e9eff5;border-radius:12px;padding:5px;margin-bottom:16px;}
.sortbar button{flex:1;border:none;background:none;padding:13px 0;font-family:inherit;font-size:15px;
  font-weight:700;color:var(--ink-soft);border-radius:9px;cursor:pointer;transition:.15s;}
.sortbar button.act{background:#fff;color:var(--primary);box-shadow:var(--shadow);}
.rank{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:transform .06s,border-color .15s;}
.rank:active{transform:scale(.99);}
.rank .more{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
  font-size:14px;font-weight:700;color:var(--primary);text-align:center;}
.rank.win{border:2px solid var(--gold);background:linear-gradient(180deg,#fffdf6,#fff);}
.rank .rk{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:6px;}
.rank.win .rk{color:var(--gold);}
.rank .meta{font-size:13px;color:var(--primary);font-weight:700;}
.rank .nm{font-size:18px;font-weight:800;color:var(--ink);line-height:1.4;margin:2px 0 9px;}
.rank .big{font-size:27px;font-weight:900;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.rank.win .big{color:var(--gold);}
.rank .big .u{font-size:16px;font-weight:700;}
.rank .brk{font-size:13px;color:var(--muted);font-weight:600;margin-top:9px;line-height:1.6;}
</style>
</head>

    h=`<div class="step-h">STEP 1 / 6</div><h2 class="step-q">보험사를 선택하세요</h2>
      <div class="opts">${ORDER.map(i=>optBtn(i, st.ins===i)).join('')}</div>`;
    $('screen').innerHTML=h;
    bindOpts(v=>{ if(st.ins!==v){st.ins=v; st.grp=st.prod=st.term=null;} next(); });

  } else if(s===2){
    const groups = GROUP_ORDER.filter(g=>DATA[st.ins][g]);
    h=`<div class="step-h">STEP 2 / 6 · ${st.ins}</div><h2 class="step-q">상품군을 선택하세요</h2>
      <div class="opts">${groups.map(g=>{
        const n=Object.keys(DATA[st.ins][g]).length;
        return optBtn(g, st.grp===g, `${n}개`);
      }).join('')}</div>${navBar(true,false)}`;
    $('screen').innerHTML=h;
    bindOpts(v=>{ if(st.grp!==v){st.grp=v; st.prod=st.term=null;} next(); });
    bindNav();

  } else if(s===3){
    const prods=Object.keys(DATA[st.ins][st.grp]);
    h=`<div class="step-h">STEP 3 / 6 · ${st.grp}</div><h2 class="step-q">상품을 선택하세요</h2>
      <div class="opts">${prods.map(p=>optBtn(p, st.prod===p)).join('')}</div>${navBar(true,false)}`;
    $('screen').innerHTML=h;
    bindOpts(v=>{ if(st.prod!==v){st.prod=v; st.term=null;} next(); });
    bindNav();

  } else if(s===4){
    const terms=Object.keys(DATA[st.ins][st.grp][st.prod]);
    h=`<div class="step-h">STEP 4 / 6 · 납기</div><h2 class="step-q">납입기간을 선택하세요</h2>
      <div class="opts">${terms.map(t=>optBtn(t, st.term===t)).join('')}</div>${navBar(true,false)}`;
    $('screen').innerHTML=h;
    bindOpts(v=>{ st.term=v; next(); });
    bindNav();

  } else if(s===5){
    h=`<div class="step-h">STEP 5 / 6 · 월납보험료</div><h2 class="step-q">월 보험료를 입력하세요</h2>
      <div class="amt-box">
        <div class="amt-input"><input id="prem" type="text" inputmode="numeric" value="${won(st.prem)}"><span class="won">원</span></div>
        <div class="amt-read" id="premRead"></div>
        <div class="quick">
          <button data-a="100000">10만</button><button data-a="200000">20만</button>
          <button data-a="300000">30만</button><button data-a="500000">50만</button>
        </div>
      </div>${navBar(true,true)}`;
    $('screen').innerHTML=h;
    const inp=$('prem');
    const fmt=()=>{ let raw=inp.value.replace(/[^0-9]/g,''); st.prem=raw?parseInt(raw):0;
      inp.value = st.prem?won(st.prem):''; readPrem(); setSummary();
      $('nextBtn').disabled = !(st.prem>0); };
    inp.addEventListener('input',fmt);
    inp.addEventListener('focus',()=>{ inp.value=st.prem?String(st.prem):''; });
    inp.addEventListener('blur',()=>{ inp.value=st.prem?won(st.prem):''; });
    document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{
      st.prem=parseInt(b.dataset.a); inp.value=won(st.prem); readPrem(); setSummary(); $('nextBtn').disabled=false; });
    readPrem(); bindNav();
    $('nextBtn').disabled = !(st.prem>0);

  } else if(s===6){
    const isCustom = st.rateMode==='custom';
    let body;
    if(isCustom){
      body = `<div class="amt-box">
        <div class="amt-input"><input id="rate" type="text" inputmode="numeric" value="${st.customRate!=null?st.customRate:''}" placeholder="0"><span class="won">%</span></div>
        <div class="amt-read" id="rateRead">본인 자체 수수료율을 입력하세요</div>
        <div class="quick">
          <button data-r="80">80</button><button data-r="75">75</button>
          <button data-r="70">70</button><button data-r="65">65</button><button data-r="60">60</button>
        </div>
      </div>`;
    } else {
      body = `<div class="opts">${GRADES.map(g=>optBtn(g[0], st.grade===g[1], `FA ${g[1]}%`)).join('')}</div>`;
    }
    h=`<div class="step-h">STEP 6 / 6 · 수수료율</div><h2 class="step-q">수수료율을 정하세요</h2>
      <div class="seg-toggle">
        <button data-m="custom" class="${isCustom?'act':''}">자체율 직접입력</button>
        <button data-m="grade" class="${!isCustom?'act':''}">등급으로 선택</button>
      </div>
      ${body}
      ${isCustom ? navBar(true,true) : navBar(true,false)}`;
    $('screen').innerHTML=h;

    document.querySelectorAll('.seg-toggle button').forEach(b=>b.onclick=()=>{ st.rateMode=b.dataset.m; render(); });

    if(isCustom){
      const inp=$('rate');
      const fmt=()=>{ let raw=inp.value.replace(/[^0-9]/g,'');
        inp.value=raw; st.customRate = raw==='' ? null : parseInt(raw);
        $('rateRead').textContent = (st.customRate>0) ? `수수료율 ${st.customRate}% 적용` : '본인 자체 수수료율을 입력하세요';
        setSummary(); $('nextBtn').disabled = !(st.customRate>0);
      };
      inp.addEventListener('input',fmt);
      document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{
        st.customRate=parseInt(b.dataset.r); inp.value=b.dataset.r; fmt(); });
      bindNav();
      $('nextBtn').textContent='조회';
      $('nextBtn').onclick=()=>{ if(st.customRate>0) showResult(); };
      $('nextBtn').disabled = !(st.customRate>0);
    } else {
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const lab=b.dataset.v; const g=GRADES.find(x=>x[0]===lab); st.grade=g[1]; showResult(); });
      bindNav();
    }
  }
}

function readPrem(){
  const eok=Math.floor(st.prem/100000000), man=Math.floor((st.prem%100000000)/10000);
  let t=''; if(eok)t+=eok+'억 '; if(man)t+=man+'만 '; 
  $('premRead').textContent = st.prem? (t+'원') : '금액을 입력하세요';
}

function navBar(prev,next,go){
  let h='<div class="nav">';
  if(prev) h+=`<button class="btn btn-prev" id="prevBtn">이전</button>`;
  if(next) h+=`<button class="btn btn-next" id="nextBtn">다음</button>`;
  if(go) h+=`<button class="btn btn-go" id="prevBtn2" style="flex:0 0 34%;background:#fff;border:2px solid var(--line-strong);color:var(--ink-soft);">이전</button>`;
  h+='</div>';
  return h;
}
function bindNav(){
  const p=$('prevBtn'); if(p)p.onclick=prev;
  const n=$('nextBtn'); if(n)n.onclick=()=>{ if(!n.disabled) next(); };
}
function bindOpts(cb){ document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>cb(b.dataset.v)); }

function next(){ if(st.step<TOTAL_STEPS){st.step++; render();} }
function prev(){ if(st.step>1){st.step--; render();} }

function showResult(){
  setProg(); setSummary();
  const base = DATA[st.ins][st.grp][st.prod][st.term].ch; // [초회,1차년,13회,2차년,3차년,4차년] @10만/97
  const rate = (st.rateMode==='custom') ? st.customRate : st.grade;
  const f = (st.prem/100000)*(rate/97);
  const v = base.map(x=>Math.round(x*f));
  const labels=['초회','1차년','13회','2차년','3차년','4차년'];
  // 표시: 1차년은 값>0일 때만 (ABL 연금 특수)
  const showIdx=[0,2,3,4,5]; if(v[1]>0) showIdx.splice(1,0,1);
  const total=v.reduce((a,b)=>a+b,0);
  let rateLabel;
  if(st.rateMode==='custom'){ rateLabel = `자체율 ${rate}%`; }
  else { rateLabel = `${GRADES.find(x=>x[1]===st.grade)[0]} (FA ${st.grade}%)`; }

  let rows = showIdx.map(i=>`<div class="row"><span class="lab">${labels[i]}</span><span class="val">${won(v[i])}원</span></div>`).join('');

  $('screen').innerHTML = `<div class="result">
    <div class="res-cond">
      <div class="l1">${st.ins} · ${st.grp}</div>
      <div class="l2">${st.prod}</div>
      <div class="l3">${st.term} · 월 ${won(st.prem)}원 · ${rateLabel}</div>
    </div>
    <div class="res-body">
      ${rows}
      <div class="row sum"><span class="lab">합계 수수료</span><span class="val">${won(total)}원</span></div>
    </div>
    <p class="disc">※ 본 자료는 환산율·수수료 상품군 차이에 따라 실제 수수료와 달라질 수 있어 참고용으로만 사용하시기 바랍니다. 최신 규정 미반영, 회사 정책 변경, 산출 조건 차이로 실제 지급액과 일치하지 않을 수 있습니다.</p>
    <div class="nav">
      <button class="btn btn-prev" onclick="restart()">처음으로</button>
      <button class="btn btn-next" onclick="st.step=6;render();">조건 수정</button>
    </div>
  </div>`;
}

function restart(){ st={ins:null,grp:null,prod:null,term:null,prem:100000,rateMode:'custom',customRate:null,grade:null,step:1}; render(); }

// ===== 수수료비교표 =====
function renderCmp(){
  $('hdrTitle').textContent='수수료비교표'; $('prog').innerHTML=''; $('summary').innerHTML=''; syncTabs();
  const cs=ct.cstep; let h='';

  if(cs==='list'){
    const n=ct.items.length;
    h=`<p class="cmp-intro">비교할 상품을 담으세요. (최대 3개)</p>`;
    h+=ct.items.map((it,i)=>`<div class="item-card"><div>
        <div class="meta">${it.ins} · ${it.grp}</div>
        <div class="nm">${it.prod}</div><div class="tm">${it.term}</div></div>
        <button class="del" data-i="${i}">✕</button></div>`).join('');
    if(n<3) h+=`<button class="add-btn" id="addBtn">＋ 상품 추가</button>`;
    if(n===0) h+=`<p class="disc">상품을 1개 이상 담으면 비교를 시작할 수 있습니다.</p>`;
    if(n>=1) h+=`<div class="nav"><button class="btn btn-next" id="toCond">다음 · 보험료·율 입력</button></div>`;
    $('screen').innerHTML=h;
    document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ ct.items.splice(parseInt(b.dataset.i),1); renderCmp(); });
    const ab=$('addBtn'); if(ab) ab.onclick=()=>{ ct.draft={step:1,ins:null,grp:null,prod:null,term:null}; ct.cstep='add'; renderCmp(); };
    const tc=$('toCond'); if(tc) tc.onclick=()=>{ ct.cstep='prem'; renderCmp(); };

  } else if(cs==='add'){
    const d=ct.draft;
    const chips=[]; if(d.ins)chips.push(d.ins); if(d.grp)chips.push(d.grp);
    if(d.prod)chips.push(d.prod.length>14?d.prod.slice(0,14)+'…':d.prod);
    $('summary').innerHTML = chips.map(c=>`<span class="chip"><b>${c}</b></span>`).join('');
    if(d.step===1){
      h=`<div class="step-h">상품 추가 · 1/4</div><h2 class="step-q">보험사를 선택하세요</h2>
        <div class="opts">${ORDER.map(i=>optBtn(i,d.ins===i)).join('')}</div>
        <div class="nav"><button class="btn btn-prev" id="bb">취소</button></div>`;
      $('screen').innerHTML=h;
      bindOpts(v=>{ d.ins=v; d.grp=d.prod=d.term=null; d.step=2; renderCmp(); });
      $('bb').onclick=()=>{ ct.cstep='list'; renderCmp(); };
    } else if(d.step===2){
      const gs=GROUP_ORDER.filter(g=>DATA[d.ins][g]);
      h=`<div class="step-h">상품 추가 · 2/4 · ${d.ins}</div><h2 class="step-q">상품군을 선택하세요</h2>
        <div class="opts">${gs.map(g=>optBtn(g,d.grp===g,`${Object.keys(DATA[d.ins][g]).length}개`)).join('')}</div>
        <div class="nav"><button class="btn btn-prev" id="bb">이전</button></div>`;
      $('screen').innerHTML=h;
      bindOpts(v=>{ d.grp=v; d.prod=d.term=null; d.step=3; renderCmp(); });
      $('bb').onclick=()=>{ d.step=1; renderCmp(); };
    } else if(d.step===3){
      const ps=Object.keys(DATA[d.ins][d.grp]);
      h=`<div class="step-h">상품 추가 · 3/4 · ${d.grp}</div><h2 class="step-q">상품을 선택하세요</h2>
        <div class="opts">${ps.map(p=>optBtn(p,d.prod===p)).join('')}</div>
        <div class="nav"><button class="btn btn-prev" id="bb">이전</button></div>`;
      $('screen').innerHTML=h;
      bindOpts(v=>{ d.prod=v; d.term=null; d.step=4; renderCmp(); });
      $('bb').onclick=()=>{ d.step=2; renderCmp(); };
    } else if(d.step===4){
      const ts=Object.keys(DATA[d.ins][d.grp][d.prod]);
      h=`<div class="step-h">상품 추가 · 4/4 · 납기</div><h2 class="step-q">납입기간을 선택하세요</h2>
        <div class="opts">${ts.map(t=>optBtn(t,d.term===t)).join('')}</div>
        <div class="nav"><button class="btn btn-prev" id="bb">이전</button></div>`;
      $('screen').innerHTML=h;
      bindOpts(v=>{ ct.items.push({ins:d.ins,grp:d.grp,prod:d.prod,term:v}); ct.cstep='list'; renderCmp(); });
      $('bb').onclick=()=>{ d.step=3; renderCmp(); };
    }

  } else if(cs==='prem'){
    h=`<div class="step-h">공통 조건 · 보험료</div><h2 class="step-q">월 보험료를 입력하세요</h2>
      <p class="cmp-intro">담은 ${ct.items.length}개 상품을 같은 보험료로 비교합니다.</p>
      <div class="amt-box">
        <div class="amt-input"><input id="cprem" type="text" inputmode="numeric" value="${won(ct.prem)}"><span class="won">원</span></div>
        <div class="amt-read" id="cpremRead"></div>
        <div class="quick"><button data-a="100000">10만</button><button data-a="200000">20만</button><button data-a="300000">30만</button><button data-a="500000">50만</button></div>
      </div>
      <div class="nav"><button class="btn btn-prev" id="bb">이전</button><button class="btn btn-next" id="nn">다음</button></div>`;
    $('screen').innerHTML=h;
    const inp=$('cprem');
    const rd=()=>{ const man=Math.floor(ct.prem/10000); $('cpremRead').textContent = ct.prem?(man+'만 원'):'금액을 입력하세요'; };
    const fmt=()=>{ let raw=inp.value.replace(/[^0-9]/g,''); ct.prem=raw?parseInt(raw):0; inp.value=ct.prem?won(ct.prem):''; rd(); $('nn').disabled=!(ct.prem>0); };
    inp.addEventListener('input',fmt);
    inp.addEventListener('focus',()=>{ inp.value=ct.prem?String(ct.prem):''; });
    inp.addEventListener('blur',()=>{ inp.value=ct.prem?won(ct.prem):''; });
    document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{ ct.prem=parseInt(b.dataset.a); inp.value=won(ct.prem); rd(); $('nn').disabled=false; });
    rd(); $('nn').disabled=!(ct.prem>0);
    $('bb').onclick=()=>{ ct.cstep='list'; renderCmp(); };
    $('nn').onclick=()=>{ if(ct.prem>0){ct.cstep='rate'; renderCmp();} };

  } else if(cs==='rate'){
    const isCustom=ct.rateMode==='custom'; let body;
    if(isCustom){
      body=`<div class="amt-box"><div class="amt-input"><input id="crate" type="text" inputmode="numeric" value="${ct.customRate!=null?ct.customRate:''}" placeholder="0"><span class="won">%</span></div>
        <div class="amt-read" id="crateRead">본인 자체 수수료율을 입력하세요</div>
        <div class="quick"><button data-r="80">80</button><button data-r="75">75</button><button data-r="70">70</button><button data-r="65">65</button><button data-r="60">60</button></div></div>`;
    } else {
      body=`<div class="opts">${GRADES.map(g=>optBtn(g[0],ct.grade===g[1],`FA ${g[1]}%`)).join('')}</div>`;
    }
    h=`<div class="step-h">공통 조건 · 수수료율</div><h2 class="step-q">수수료율을 정하세요</h2>
      <div class="seg-toggle"><button data-m="custom" class="${isCustom?'act':''}">자체율 직접입력</button><button data-m="grade" class="${!isCustom?'act':''}">등급으로 선택</button></div>
      ${body}
      <div class="nav"><button class="btn btn-prev" id="bb">이전</button>${isCustom?'<button class="btn btn-next" id="nn">비교하기</button>':''}</div>`;
    $('screen').innerHTML=h;
    document.querySelectorAll('.seg-toggle button').forEach(b=>b.onclick=()=>{ ct.rateMode=b.dataset.m; renderCmp(); });
    $('bb').onclick=()=>{ ct.cstep='prem'; renderCmp(); };
    if(isCustom){
      const inp=$('crate');
      const fmt=()=>{ let raw=inp.value.replace(/[^0-9]/g,''); inp.value=raw; ct.customRate=raw===''?null:parseInt(raw);
        $('crateRead').textContent=(ct.customRate>0)?`수수료율 ${ct.customRate}% 적용`:'본인 자체 수수료율을 입력하세요'; $('nn').disabled=!(ct.customRate>0); };
      inp.addEventListener('input',fmt);
      document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{ ct.customRate=parseInt(b.dataset.r); inp.value=b.dataset.r; fmt(); });
      $('nn').disabled=!(ct.customRate>0);
      $('nn').onclick=()=>{ if(ct.customRate>0){ct.cstep='result'; renderCmp();} };
    } else {
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const g=GRADES.find(x=>x[0]===b.dataset.v); ct.grade=g[1]; ct.cstep='result'; renderCmp(); });
    }

  } else if(cs==='result'){
    const rate=(ct.rateMode==='custom')?ct.customRate:ct.grade;
    const f=(ct.prem/100000)*(rate/97);
    const rows=ct.items.map(it=>{
      const base=DATA[it.ins][it.grp][it.prod][it.term].ch;
      const v=base.map(x=>Math.round(x*f));
      return {ins:it.ins,grp:it.grp,prod:it.prod,term:it.term,first:v[0],ch:v,sum:v.reduce((a,b)=>a+b,0)};
    });
    rows.sort((a,b)=> ct.sortBy==='first' ? b.first-a.first : b.sum-a.sum);
    const rateLabel = ct.rateMode==='custom' ? `자체율 ${rate}%` : `${GRADES.find(x=>x[1]===ct.grade)[0]}(FA ${ct.grade}%)`;
    h=`<h2 class="step-q" style="margin-bottom:6px;">💰 수수료 비교 · ${rows.length}개</h2>
      <p class="cmp-intro">월 ${won(ct.prem)}원 · ${rateLabel} 기준</p>
      <div class="sortbar">
        <button data-s="sum" class="${ct.sortBy==='sum'?'act':''}">합계 높은순</button>
        <button data-s="first" class="${ct.sortBy==='first'?'act':''}">초회 높은순</button>
      </div>`;
    h+=rows.map((r,i)=>{
      const win=i===0;
      const brk=`초회 ${won(r.ch[0])}원 · 13회 ${won(r.ch[2])}원 · 2차년 ${won(r.ch[3])}원 · 3차년 ${won(r.ch[4])}원`;
      return `<div class="rank ${win?'win':''}" data-i="${i}">
        <div class="rk">${win?'👑 1위 · 가장 유리':(i+1)+'위'}</div>
        <div class="meta">${r.ins} · ${r.grp}</div>
        <div class="nm">${r.prod} <span style="font-weight:600;color:var(--muted);font-size:14px;">/ ${r.term}</span></div>
        <div class="big">${won(r.sum)}<span class="u">원</span></div>
        <div class="brk">${brk}</div>
        <div class="more">탭하여 회차별 상세보기 ›</div></div>`;
    }).join('');
    h+=`<p class="disc">※ 참고용입니다. 환산율·상품군 차이, 최신 규정 미반영 등으로 실제 지급액과 다를 수 있습니다.</p>
      <div class="nav"><button class="btn btn-prev" id="bb">다시 담기</button><button class="btn btn-next" id="nn">조건 수정</button></div>`;
    $('screen').innerHTML=h;
    document.querySelectorAll('.sortbar button').forEach(b=>b.onclick=()=>{ ct.sortBy=b.dataset.s; renderCmp(); });
    document.querySelectorAll('.rank').forEach(el=>el.onclick=()=>{ ct.detail=rows[parseInt(el.dataset.i)]; ct.cstep='detail'; renderCmp(); });
    $('bb').onclick=()=>{ ct.cstep='list'; renderCmp(); };
    $('nn').onclick=()=>{ ct.cstep='rate'; renderCmp(); };

  } else if(cs==='detail'){
    const r=ct.detail;
    const rate=(ct.rateMode==='custom')?ct.customRate:ct.grade;
    const rateLabel = ct.rateMode==='custom' ? `자체율 ${rate}%` : `${GRADES.find(x=>x[1]===ct.grade)[0]} (FA ${ct.grade}%)`;
    const v=r.ch;
    const labels=['초회','1차년','13회','2차년','3차년','4차년'];
    const showIdx=[0,2,3,4,5]; if(v[1]>0) showIdx.splice(1,0,1);
    const rowsH=showIdx.map(i=>`<div class="row"><span class="lab">${labels[i]}</span><span class="val">${won(v[i])}원</span></div>`).join('');
    h=`<div class="result">
      <div class="res-cond">
        <div class="l1">${r.ins} · ${r.grp}</div>
        <div class="l2">${r.prod}</div>
        <div class="l3">${r.term} · 월 ${won(ct.prem)}원 · ${rateLabel}</div>
      </div>
      <div class="res-body">
        ${rowsH}
        <div class="row sum"><span class="lab">합계 수수료</span><span class="val">${won(r.sum)}원</span></div>
      </div>
      <p class="disc">※ 본 자료는 환산율·수수료 상품군 차이에 따라 실제 수수료와 달라질 수 있어 참고용으로만 사용하시기 바랍니다.</p>
      <div class="nav"><button class="btn btn-prev" id="bb">← 비교 결과로</button></div>
    </div>`;
    $('screen').innerHTML=h;
    $('bb').onclick=()=>{ ct.cstep='result'; renderCmp(); };
  }
}

const AUTH={ password:'incar2026' };
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); render(); }
function tryLogin(){
  const id=$('empId').value.trim(), pw=$('pw').value;
  if(!/^[0-9]{4,}$/.test(id)){ $('loginErr').textContent='사번은 숫자로 입력해 주세요.'; return; }
  if(pw!==AUTH.password){ $('loginErr').textContent='비밀번호가 올바르지 않습니다.'; return; }
  $('loginErr').textContent='';
  try{ localStorage.setItem('incar_auth','1'); }catch(e){}
  showApp();
}
function logout(){ try{ localStorage.removeItem('incar_auth'); }catch(e){} location.reload(); }
$('loginBtn').onclick=tryLogin;
$('logoutBtn').onclick=logout;
$('empId').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pw').focus(); });
$('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });

let _saved=false; try{ _saved = localStorage.getItem('incar_auth')==='1'; }catch(e){}
if(_saved) showApp();
